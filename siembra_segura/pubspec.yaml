name: siembra_segura
description: "Siembra Segura: guía de siembra para agricultores del valle, basada en clima y datos satelitales."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.7.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_tts: ^4.2.5
  go_router: ^17.2.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Atkinson Hyperlegible (OFL), la letra de semi_app.html: pensada para
    # leerse bien con poca vista. Solo trae normal y negrita.
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic
